<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gezi Günlüğüm</title>
    <!-- Seçilen temayı sayfa çizilmeden önce uygula (beyaz yanıp sönmesin) -->
    <script>
      try { var t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Harita kütüphanesi -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="ana-sayfa kapakli">
    <header class="menu" id="menu"></header>

    <!-- KAPAK (sadece ana sayfada görünür) -->
    <section class="hero" id="hero">
      <div class="hero-icerik">
        <p class="ust-yazi">Seyahat · Vlog · Rehber</p>
        <h1>Dünyayı adım adım<br />keşfediyoruz</h1>
        <p class="hero-alt">
          Gittiğimiz yerlerden hikâyeler, videolar, ipuçları ve bolca fotoğraf.
        </p>
        <button class="hero-arama" data-arama-ac>
          <i class="fa-solid fa-magnifying-glass"></i>
          <span>Nereye gitmek istersin? Ülke, yer ya da konu ara…</span>
          <kbd>/</kbd>
        </button>
        <div class="hero-butonlar">
          <a href="#kesfet" class="buton">Keşfetmeye başla <i class="fa-solid fa-arrow-down"></i></a>
          <a href="#video" class="buton cam"><i class="fa-solid fa-play"></i> Son video</a>
        </div>
      </div>
    </section>

    <!-- SAYFA BAŞLIĞI (kıta / ülke seçilince görünür) -->
    <section class="sayfa-baslik" id="sayfa-baslik">
      <p id="yol"></p>
      <h2 id="bolge-baslik"></h2>
      <p id="bolge-alt"></p>
    </section>

    <main id="kesfet">
      <div id="icerik"></div>
    </main>

    <footer class="alt-bilgi" id="alt-bilgi"></footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="veri.js"></script>
    <script src="ortak.js"></script>
    <script src="script.js"></script>
  </body>
</html>
